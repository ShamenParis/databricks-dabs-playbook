bundle:
  name: 01-introduction-to-dab

# workspace:
#   host: ${workspace.host}  # For free edition this can be removed and workspace configuration will be picked up from the CLI profile.

resources:
  jobs:
    hello_world_job:
      name: "01_Hello_World_DAB"
      tasks:
        - task_key: "print_hello"
          spark_python_task:
            python_file: "./src/hello_world.py"
          environment_key: Default
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        DAB-Demo: "true"
            
      # Free Edition compatibility - Use serverless compute
      # If you are using a paid workspace, you can uncomment the following code to use a standard cluster:
      # job_clusters:
      #   - job_cluster_key: "hello_world_job"
      #     new_cluster:
      #       spark_version: "15.4.x-scala2.12"
      #       node_type_id: "Standard_DS4_v2"
      #       num_workers: 1
targets:
  development:
    mode: development