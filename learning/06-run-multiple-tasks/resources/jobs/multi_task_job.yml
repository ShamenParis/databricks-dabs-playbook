resources:
  jobs:
    multi_task_job:
      name: "06_Run_Multiple_Tasks"
      
      tasks:
        # Task A: The starting point
        - task_key: "task_a_ingest"
          notebook_task:
            notebook_path: "../../src/task_a.py"
          environment_key: Default
            
        # Task B: Runs after A
        - task_key: "task_b_transform"
          depends_on:
            - task_key: "task_a_ingest"
          notebook_task:
            notebook_path: "../../src/task_b.py"
          environment_key: Default

        # Task C: Runs after B
        - task_key: "task_c_aggregate"
          depends_on:
            - task_key: "task_b_transform"
          notebook_task:
            notebook_path: "../../src/task_c.py"
          environment_key: Default

        # Task D: Runs after A (Parallel to B)
        - task_key: "task_d_data_quality"
          depends_on:
            - task_key: "task_a_ingest"
          notebook_task:
            notebook_path: "../../src/task_d.py"
          environment_key: Default

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        DAB-Demo: "true"