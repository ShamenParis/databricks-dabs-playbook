resources:
  jobs:
    table_trigger_job:
      name: "05_Table_Update_Trigger_Job"
      
      # Configure the job to trigger when a specific Delta table is modified
      trigger:
        table_update:
          table_names:
            - "main.demo.landing_table" # Update here if using different catalog/schema/table names
          min_time_between_triggers_seconds: 61
          wait_after_last_change_seconds: 61
        
      tasks:
        - task_key: "process_table_updates"
          notebook_task:
            notebook_path: "../../src/table_trigger_notebook.py"
          environment_key: Default
          
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        DAB-Demo: "true"