resources:
  jobs:
    sql_alert_job:
      name: "10_Run_SQL_Alerts"

      tasks:
        # Task A: Setup the data
        - task_key: "task_a_setup_data"
          notebook_task:
            notebook_path: "../../src/task_a_setup.py"
          environment_key: Default
            
        # Task B: Trigger the Alert evaluation
        - task_key: "task_b_trigger_alert"
          depends_on:
            - task_key: "task_a_setup_data"
          alert_task:
            alert_id: ${resources.alerts.data_quality_alert.id} # This is refering the alert id from the resources/alerts/data_quality_alert.yml
            warehouse_id: ${var.sql_warehouse_id}

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        DAB-Demo: "true"