  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  - resources/dashboards/*.yml
  - resources/genie_spaces/*.yml
  - resources/apps/*.yml
  - resources/clusters/*.yml
  - resources/sql_warehouses/*.yml
  - resources/experiments/*.yml
  - resources/registered_models/*.yml
  - resources/quality_monitors/*.yml

targets:
  development:
    mode: development
